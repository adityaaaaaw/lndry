name: lndry
description: "LNDRY — A production-grade laundry marketplace connecting customers, vendors, and delivery partners."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── UI / Responsive ───────────────────────────────────────────────────────
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # ── Networking ────────────────────────────────────────────────────────────
  dio: any
  pretty_dio_logger: any

  # ── Local Storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # ── Serialization ─────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  equatable: ^2.0.5
  intl: ^0.19.0
  collection: ^1.18.0
  fpdart: ^1.1.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.3
  geocoding: ^4.0.0
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0
  razorpay_flutter: ^1.4.0

  # ── Image & Assets ────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

  # ── Firebase (configured later) ────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.1.0

  # ── Misc ──────────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: any
  freezed: any
  json_serializable: any
  riverpod_generator: any
  custom_lint: any
  riverpod_lint: any
  hive_generator: any

  # ── Testing ───────────────────────────────────────────────────────────────
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/lottie/
    - assets/svg/
    - assets/mock/
    - assets/fonts/
