name: lndry_vendor_app
description: "LNDRY Vendor App — Production-grade vendor management application for laundry marketplace."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── UI / Responsive ───────────────────────────────────────────────────────
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # ── Networking ────────────────────────────────────────────────────────────
  dio: any
  pretty_dio_logger: any

  # ── Local Storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # ── Serialization ─────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  equatable: ^2.0.5
  intl: ^0.19.0
  collection: ^1.18.0
  fpdart: ^1.1.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.3
  geocoding: ^4.0.0
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  gap: ^3.0.1

  # ── Image & Assets ────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

  # ── Firebase (configured later) ────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: any
  freezed: any
  json_serializable: any
  riverpod_generator: any
  custom_lint: any
  riverpod_lint: any
  hive_generator: any

  # ── Testing ───────────────────────────────────────────────────────────────
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/banners/
    - assets/icons/
    - assets/icons/services/
    - assets/illustrations/
    - assets/lottie/
    - assets/svg/
    - assets/mock/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.png
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: "#FFFFFF"
    theme_color: "#1D1BAF"
  windows:
    generate: true
    image_path: assets/images/logo.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/images/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.png
